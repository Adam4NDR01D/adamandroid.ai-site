<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@adamandroid Handle Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    padding: 32px 24px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 28px;
  }
  .brands {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .brand-tag {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    color: #aaa;
  }
  .brand-tag span { color: #fff; font-weight: 600; }

  /* Progress bar */
  .progress-section {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
  }
  .progress-counts {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .count { font-size: 0.82rem; }
  .count .num { font-size: 1.1rem; font-weight: 700; margin-right: 4px; }
  .count.mine .num { color: #4caf50; }
  .count.taken .num { color: #f44336; }
  .count.available .num { color: #2196f3; }
  .count.unchecked .num { color: #888; }
  .progress-bar-track {
    height: 6px;
    background: #2a2a2a;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }
  .progress-bar-mine { background: #4caf50; height: 100%; transition: width 0.3s; }
  .progress-bar-taken { background: #f44336; height: 100%; transition: width 0.3s; }
  .progress-bar-available { background: #2196f3; height: 100%; transition: width 0.3s; }

  /* Sections */
  .section {
    margin-bottom: 32px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #222;
  }
  .section-header h2 {
    font-size: 0.95rem;
    font-weight: 600;
    color: #ccc;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .section-header .section-icon { font-size: 1rem; }
  .section-count {
    margin-left: auto;
    font-size: 0.75rem;
    color: #555;
  }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  tr {
    border-bottom: 1px solid #1c1c1c;
    transition: background 0.15s;
  }
  tr:hover { background: #161616; }
  td { padding: 9px 8px; vertical-align: middle; }
  .td-priority { width: 28px; text-align: center; font-size: 0.7rem; }
  .td-platform { font-size: 0.9rem; font-weight: 500; }
  .td-platform a {
    color: #e0e0e0;
    text-decoration: none;
  }
  .td-platform a:hover { color: #fff; text-decoration: underline; }
  .td-brand { width: 80px; }
  .td-notes { width: 200px; }
  .td-status { width: 220px; text-align: right; }

  .brand-pill {
    display: inline-block;
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .brand-com { background: #1a2a3a; color: #60a5fa; border: 1px solid #2a4a6a; }
  .brand-ai  { background: #1a2a1a; color: #4caf50; border: 1px solid #2a4a2a; }
  .brand-both { background: #2a1a2a; color: #c084fc; border: 1px solid #4a2a4a; }

  /* Status buttons */
  .status-btns { display: flex; gap: 5px; justify-content: flex-end; }
  .btn {
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: #1e1e1e;
    color: #666;
    border-color: #2a2a2a;
    letter-spacing: 0.02em;
  }
  .btn:hover { opacity: 0.85; }
  .btn.active-mine      { background: #1b3a1e; color: #4caf50; border-color: #4caf50; }
  .btn.active-available { background: #1a2a3a; color: #60a5fa; border-color: #2196f3; }
  .btn.active-taken     { background: #3a1a1a; color: #f44336; border-color: #f44336; }

  /* Notes input */
  .notes-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid #2a2a2a;
    color: #888;
    font-size: 0.75rem;
    width: 100%;
    padding: 2px 4px;
    outline: none;
    font-family: inherit;
  }
  .notes-input:focus {
    border-bottom-color: #555;
    color: #ccc;
  }
  .notes-input::placeholder { color: #3a3a3a; }

  /* Pre-populated note badges */
  .note-badge {
    font-size: 0.7rem;
    color: #888;
    font-style: italic;
  }
  .note-badge.warn { color: #f59e0b; }
  .note-badge.bad  { color: #f44336; }
  .note-badge.good { color: #4caf50; }

  /* Priority dots */
  .dot-high   { color: #f44336; font-size: 0.65rem; }
  .dot-med    { color: #f59e0b; font-size: 0.65rem; }
  .dot-low    { color: #4caf50; font-size: 0.65rem; }

  /* Reset button */
  .top-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    align-items: center;
  }
  .action-btn {
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 0.78rem;
    color: #888;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .action-btn:hover { background: #252525; color: #ccc; }
  .namecheckr-link {
    margin-left: auto;
    background: #1a2a3a;
    border: 1px solid #2a4a6a;
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 0.78rem;
    color: #60a5fa;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    display: inline-block;
  }
  .namecheckr-link:hover { background: #1e3045; }
</style>
</head>

<div class="brands">

const KEY = "adamandroid_tracker_v2";

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; }
}
function saveState(s) {
  localStorage.setItem(KEY, JSON.stringify(s));
}

let state = loadState();

// Pre-fill defaults only if no saved state for that item
PLATFORMS.forEach(section => {
  section.items.forEach(item => {
    if (item.prefill && !state[item.id]) {
      state[item.id] = { status: item.prefill.status, note: item.prefill.note || "" };
    }
    if (!state[item.id]) {
      state[item.id] = { status: null, note: item.note || "" };
    }
  });
});
saveState(state);

function setStatus(id, status) {
  const cur = state[id] || {};
  if (cur.status === status) {
    cur.status = null; // toggle off
  } else {
    cur.status = status;
  }
  state[id] = cur;
  saveState(state);
  renderBtns(id);
  updateProgress();
}

function setNote(id, val) {
  state[id] = state[id] || {};
  state[id].note = val;
  saveState(state);
}

function renderBtns(id) {
  const s = (state[id] || {}).status;
  ["mine","available","taken"].forEach(st => {
    const el = document.getElementById(`btn-${id}-${st}`);
    if (el) {
      el.className = "btn" + (s === st ? ` active-${st}` : "");
    }
  });
}

function updateProgress() {
  let mine=0, avail=0, taken=0, total=0;
  PLATFORMS.forEach(sec => sec.items.forEach(item => {
    total++;
    const s = (state[item.id]||{}).status;
    if (s === "mine") mine++;
    else if (s === "available") avail++;
    else if (s === "taken") taken++;
  }));
  const unchecked = total - mine - avail - taken;
  document.getElementById("cnt-mine").textContent = mine;
  document.getElementById("cnt-available").textContent = avail;
  document.getElementById("cnt-taken").textContent = taken;
  document.getElementById("cnt-unchecked").textContent = unchecked;
  document.getElementById("bar-mine").style.width = (mine/total*100) + "%";
  document.getElementById("bar-available").style.width = (avail/total*100) + "%";
  document.getElementById("bar-taken").style.width = (taken/total*100) + "%";
}

function brandPill(brand) {
  if (brand === "com") return `<span class="brand-pill brand-com">.com</span>`;
  if (brand === "ai")  return `<span class="brand-pill brand-ai">.ai</span>`;
  return `<span class="brand-pill brand-both">both</span>`;
}

function priorityDot(p) {
  if (p === "high") return `<span class="dot-high" title="High priority">●</span>`;
  if (p === "med")  return `<span class="dot-med"  title="Medium priority">●</span>`;
  return `<span class="dot-low" title="Low priority">●</span>`;
}

function render() {
  const container = document.getElementById("sections-container");
  let html = "";

  PLATFORMS.forEach(section => {
    const sectionId = section.section.replace(/[^a-z]/gi,'');
    html += `<div class="section">
      <div class="section-header">
        <h2>${section.section}</h2>
        <span class="section-count">${section.items.length} platforms</span>
      </div>
      <table>`;

    section.items.forEach(item => {
      const s = state[item.id] || {};
      const note = s.note || "";
      html += `<tr>
        <td class="td-priority">${priorityDot(item.priority)}</td>
        <td class="td-platform">
          <a href="${item.url}" target="_blank">${item.name} ↗</a>
        </td>
        <td class="td-brand">${brandPill(item.brand)}</td>
        <td class="td-notes">
          <input class="notes-input" id="note-${item.id}" type="text"
            placeholder="add notes…" value="${note.replace(/"/g,'&quot;')}"
            oninput="setNote('${item.id}', this.value)">
        </td>
        <td class="td-status">
          <div class="status-btns">
            <button class="btn" id="btn-${item.id}-mine"      onclick="setStatus('${item.id}','mine')">✓ Mine</button>
            <button class="btn" id="btn-${item.id}-available" onclick="setStatus('${item.id}','available')">Available</button>
            <button class="btn" id="btn-${item.id}-taken"     onclick="setStatus('${item.id}','taken')">✗ Taken</button>
          </div>
        </td>
      </tr>`;
    });

    html += `</table></div>`;
  });

  container.innerHTML = html;

  // Apply button states
  PLATFORMS.forEach(section => {
    section.items.forEach(item => renderBtns(item.id));
  });

  updateProgress();
}

function resetAll() {
  PLATFORMS.forEach(sec => sec.items.forEach(item => {
    state[item.id] = { status: null, note: item.note || "" };
    if (item.prefill) {
      state[item.id].status = item.prefill.status;
      state[item.id].note = item.prefill.note || "";
    }
  }));
  saveState(state);
  render();
}

function exportSummary() {
  let out = "# @adamandroid Handle Status\n\n";
  const groups = { mine: [], available: [], taken: [], unchecked: [] };
  PLATFORMS.forEach(sec => {
    sec.items.forEach(item => {
      const s = (state[item.id]||{}).status || "unchecked";
      const note = (state[item.id]||{}).note;
      const row = `- [${item.name}](${item.url})${note ? " — " + note : ""}`;
      groups[s].push(row);
    });
  });
  out += "## ✅ Mine\n" + (groups.mine.join("\n") || "none") + "\n\n";
  out += "## 🔵 Available\n" + (groups.available.join("\n") || "none") + "\n\n";
  out += "## ❌ Taken\n" + (groups.taken.join("\n") || "none") + "\n\n";
  out += "## ⬜ Unchecked\n" + (groups.unchecked.join("\n") || "none") + "\n";

  const blob = new Blob([out], {type: "text/markdown"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "adamandroid_handle_status.md";
  a.click();
}

render();
</script>
</body>
